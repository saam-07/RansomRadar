# AdaptShield Backend Configuration
server:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:3000"
    - "http://127.0.0.1:5173"
    - "*"

database:
  url: "sqlite:///data/adaptshield.db"

pipeline:
  default_detector: "xgboost"
  default_policy: "immediate"   # immediate | manual | none
  default_mode: "simulated"     # simulated | live
  ewma_alpha: 0.4
  critical_confirm_windows: 2
  panic_storm_threshold: 5

features:
  live_agent_source_enabled: false
  real_containment_enabled: false
