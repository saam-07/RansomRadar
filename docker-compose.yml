version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: adaptshield-backend
    ports:
      - "8000:8000"
    environment:
      - ADAPTSHIELD_MODE=simulated
      - ADAPTSHIELD_DEFAULT_DETECTOR=xgboost
      - ADAPTSHIELD_DEFAULT_POLICY=immediate
      - ADAPTSHIELD_DB_URL=sqlite:///data/adaptshield.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: adaptshield-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: adaptshield-network
