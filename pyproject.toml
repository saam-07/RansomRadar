[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptshield"
version = "0.2.0"
description = "Autonomous Linux Ransomware Detection and Containment System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AdaptShield Team"}
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=1.7.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
demo = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
    "sqlalchemy>=2.0.0"
]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0"
]

[project.scripts]
adaptshield = "adaptshield.cli:main"
adaptshield-agent = "adaptshield.agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "root: tests requiring root privileges or real Linux kernel facilities",
    "e2e: end-to-end integration tests"
]
filterwarnings = [
    "ignore::DeprecationWarning"
]
