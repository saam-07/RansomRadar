name: AdaptShield CI
on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  agent-and-backend:
    name: Agent, Backend & ML Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
          pip install -e ".[dev,demo]"

      - name: Run Ruff Lint Checks
        run: |
          ruff check src tests --select=E,F,W --ignore=E501

      - name: Verify Dataset Generation & Reproducibility
        run: |
          python scripts/make_datasets.py

      - name: Verify ML Training & Model Registry
        run: |
          python scripts/train_all.py

      - name: Run Pytest Test Suite (Unit & Non-Root)
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v -m "not root" --durations=10

  frontend:
    name: React & TypeScript Frontend Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Typecheck & Production Build
        working-directory: frontend
        run: npm run build

      - name: Run Vitest Unit & Component Tests
        working-directory: frontend
        run: npm test -- --run
